<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mapa de carrera - Ingeniería Informática</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        html, body {
            height: 100vh; 
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden; 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: oklch(96% 0.01 250);
            color: oklch(28% 0 0);
            display: flex;
            flex-direction: column; 
        }

        header {
            background-color: oklch(91% 0.02 303);
            height: 70px; 
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 4px oklch(0% 0 0 / 0.1);
            z-index: 10;
            flex-shrink: 0;
            gap: 15px;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: oklch(18% 0 0);
            white-space: nowrap;
        }

        .leyenda-container {
            display: flex;
            gap: 8px;
            font-size: 0.85rem;
            color: oklch(45% 0 0);
            flex-wrap: wrap; 
            justify-content: center;
        }

        .leyenda-item {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 3px 5px;
            border-radius: 4px;
            background-color: oklch(96% 0.01 250);
        }

        .color-box {
            width: 15px;
            height: 15px;
            border-radius: 3px;
            border: 1px solid oklch(0% 0 0 / 0.2);
        }

        .progress-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            margin: 0;
        }

        #progress-text {
            font-size: 0.8rem;
            font-weight: 700;
            color: oklch(45% 0 0);
            margin: 0;
            white-space: nowrap;
        }

        .progress-bar-bg {
            width: 150px; 
            height: 10px;
            background-color: oklch(100% 0 0);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 1px 2px oklch(0% 0 0 / 0.1);
        }

        #progress-fill {
            height: 100%;
            width: 0%;
            background-color: oklch(80% 0.22 145);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #clear {
            background-color: oklch(63% 0.23 29);
            color: oklch(100% 0 0);
            border: none;
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        #clear:hover {
            background-color: oklch(56% 0.21 29);
        }

        footer {
            height: 30px;
            background-color: oklch(96% 0.01 250);
            display: flex;
            justify-content: center; 
            align-items: center;
            font-size: 0.8rem;
            color: oklch(50% 0 0);
            border-top: 1px solid oklch(90% 0 0);
        }

        footer a {
            color: oklch(60% 0.22 290);
            text-decoration: none;
            margin-left: 5px;
        }

        footer a:hover {
            text-decoration: underline;
        }

        #network {
            width: 100%;
            height: calc(100vh - 100px);
            border: 1px solid oklch(85% 0 0);
        }
    </style>
</head>
<body>
    <header>
        <h1>Mapa Ing. Informática 2026</h1>
        <div class="leyenda-container">
            <div class="leyenda-item">
                <div class="color-box" style="background-color: oklch(83% 0.14 235);"></div>
                <span>1er año</span>
            </div>
            <div class="leyenda-item">
                <div class="color-box" style="background-color: oklch(73% 0.18 25);"></div>
                <span>2do año</span>
            </div>
            <div class="leyenda-item">
                <div class="color-box" style="background-color: oklch(83% 0.08 290);"></div>
                <span>3er año</span>
            </div>
            <div class="leyenda-item">
                <div class="color-box" style="background-color: oklch(77% 0.21 65);"></div>
                <span>4to año</span>
            </div>
            <div class="leyenda-item">
                <div class="color-box" style="background-color: oklch(91% 0.23 128);"></div>
                <span>5to año</span>
            </div>
        </div>
        <div class="progress-container">
            <span id="progress-text">0 de 0 (0%)</span>
            <div class="progress-bar-bg">
                <div id="progress-fill"></div>
            </div>
        </div>
        <button id="clear">Limpiar Selección</button>
    </header>
    <div id="network"></div>
    <footer>
        Desarrollado con 💜 por
        <a href="https://github.com/ValuBelu/mapa_ing_informatica_2026" target="_blank"><strong> Valentina (ValuBelu)</strong></a>
    </footer>
    <script src="script.js"></script>
</body>
</html>
