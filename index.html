<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de carrera - Ingeniería Informática</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    
</head>
<body>
    <header>
        <h1>Mapa Ing. Informática 2026</h1>
        <div class="leyenda-container">
            <div class="leyenda-item">
                <div class="color-box" style="background-color: oklch(83% 0.14 235);"></div>
                <span>1er año</span>
            </div>
            <div class="leyenda-item">
                <div class="color-box" style="background-color: oklch(73% 0.18 25);"></div>
                <span>2do año</span>
            </div>
            <div class="leyenda-item">
                <div class="color-box" style="background-color: oklch(83% 0.08 290);"></div>
                <span>3er año</span>
            </div>
            <div class="leyenda-item">
                <div class="color-box" style="background-color: oklch(77% 0.21 65);"></div>
                <span>4to año</span>
            </div>
            <div class="leyenda-item">
                <div class="color-box" style="background-color: oklch(91% 0.23 128);"></div>
                <span>5to año</span>
            </div>
        </div>
        <div class="progress-container">
            <span id="progress-text">0 de 0 (0%)</span>
            <div class="progress-bar-bg">
                <div id="progress-fill"></div>
            </div>
        </div>
        <div class="actions-container">
            <button id="theme-toggle" title="Cambiar Tema" aria-label="Cambiar tema oscuro/claro">
                <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                
                <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
            <button id="clear">Limpiar Selección</button>
        </div>
    </header>
    <div id="network"></div>
    <footer>
        Desarrollado con 💜 por
        <a href="https://github.com/ValuBelu/mapa_ing_informatica_2026" target="_blank"><strong> Valentina (ValuBelu)</strong></a>
    </footer>
    <script src="script.js"></script>
</body>
</html>
